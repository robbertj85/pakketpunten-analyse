name: Fetch GLS Data

on:
  # Run on schedule (before main update job)
  schedule:
    - cron: '0 0 * * 1'  # Monday 00:00 UTC
  workflow_dispatch:
    inputs:
      force_save:
        description: 'Accept the fetched count as the new baseline even if it dropped sharply'
        type: boolean
        default: false

jobs:
  fetch-gls:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GLS data
        id: fetch
        run: python scripts/gls_fetch_all.py
        timeout-minutes: 15
        continue-on-error: true
        env:
          CACHE_GUARD_FORCE: ${{ inputs.force_save && '1' || '' }}

      - name: Report anomaly
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::GLS data anomaly detected — existing cache preserved"
          echo "## ⚠️ GLS data anomaly" >> "$GITHUB_STEP_SUMMARY"
          echo "Location count dropped >20% or returned 0 results." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing cache preserved. If next Monday's fetch lands within 5% of this one," >> "$GITHUB_STEP_SUMMARY"
          echo "the guard accepts it as the new baseline automatically. To accept it now, re-run" >> "$GITHUB_STEP_SUMMARY"
          echo "this workflow with \`force_save\` enabled." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # See fetch-amazon-data.yml: this runs whatever the fetch outcome, because
      # a blocked run's entry in data/fetch_history.json is what next week's run
      # confirms the new baseline against.
      - name: Commit and push GLS data
        run: |
          # Separate adds on purpose: one `git add` with a missing pathspec
          # stages nothing at all, and fetch_history.json does not exist
          # until the guard has run at least once.
          git add data/gls_all_locations.json 2>/dev/null || true
          git add data/fetch_history.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          if git diff --staged --name-only | grep -q 'gls_all_locations.json'; then
            msg="🤖 Update GLS data - $(date +'%Y-%m-%d %H:%M UTC')"
          else
            msg="🤖 Record GLS fetch count (cache unchanged) - $(date +'%Y-%m-%d %H:%M UTC')"
          fi

          git commit -m "$msg"
          # Commit first, then rebase onto whatever reached main during the run
          # (a code push, the other workflow); retry in case main moves again.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
